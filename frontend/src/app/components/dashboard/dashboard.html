<div class="dashboard-carhub">

  <header class="dashboard-carhub-header">
    <div class="logo">
      <h2>CAR<span>HUB</span></h2>
      <p class="tagline">// terminal_concesionaria</p>
    </div>

    <div class="estado-sistema">
      <span class ="status-indicador animate-pulse"></span>
      <span class="status-text">Sistema en línea</span>
    </div>

    <div class="zona-auth">
      <button class="btn-carhub-logout" (click)="logout()">Cerrar Sesion</button>
    </div>
  </header>

  <main class="carhub-layout">

    <aside class="carhub-busqueda">
      <h3>Parametros de Busqueda</h3>

      <div class="carhub-filtros">
        <h4>Marca</h4>
        <div class="filtros-marca">
          <label><input type="checkbox" name="marca" value="Toyota"> Toyota</label>
          <label><input type="checkbox" name="marca" value="Honda"> Honda</label>
          <label><input type="checkbox" name="marca" value="Ford"> Ford</label>
          <label><input type="checkbox" name="marca" value="Chevrolet"> Chevrolet</label>
        </div>
      </div>

      <div class="carhub-filtros">
        <h4>Modelo de Vehículo</h4>
        <div class="filtros-modelo">
          <label><input type="checkbox" name="modelo" value="Camry"> Camry</label>
          <label><input type="checkbox" name="modelo" value="Civic"> Civic</label>
          <label><input type="checkbox" name="modelo" value="F-150"> F-150</label>
          <label><input type="checkbox" name="modelo" value="Silverado"> Silverado</label>
        </div>
      </div>

      <div class="carhub-filtros">
        <h4>Precio</h4>
        <div class="filtros-precio">
          <input type="text" placeholder="$1.000.000" /> <!--precio minimo-->
          <span class="precio-separador">//</span>
          <input type="text" placeholder="$10.000.000" /> <!--precio maximo-->
        </div>
      </div>
    </aside>
    
    <section class="carhub-catalogo">
      <h3>Resultados de Búsqueda</h3>

      <div class="resultados">
        <div class="carhub-autos">
          <div class="auto-card">
            <img src="assets/camry.jpg" alt="Toyota Camry">
            <h4>Toyota Camry</h4>
            <p>Precio: $3.500.000</p>
            <button class="btn-carhub-detalles">Ver Detalles</button>
          </div>

          <div class="auto-card">
            <img src="assets/civic.jpg" alt="Honda Civic">
            <h4>Honda Civic</h4>
            <p>Precio: $2.500.000</p>
            <button class="btn-carhub-detalles">Ver Detalles</button>
          </div>

          <div class="auto-card">
            <img src="assets/f150.jpg" alt="Ford F-150">
            <h4>Ford F-150</h4>
            <p>Precio: $3.500.000</p>
            <button class="btn-carhub-detalles">Ver Detalles</button>
          </div>

          <div class="auto-card">
            <img src="assets/silverado.jpg" alt="Chevrolet Silverado">
            <h4>Chevrolet Silverado</h4>
            <p>Precio: $4.750.000</p>
            <button class="btn-carhub-detalles">Ver Detalles</button>
          </div>
        
      </div>
     </div>
    </section>
  </main>
</div>

<app-footer-component></app-footer-component>
